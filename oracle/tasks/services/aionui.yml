---
- vars:
      app_name: aionui
      config:
          root: '{{ env.JARVIS_CONFIGS_DIR }}/{{ app_name }}'
      src: '/home/ubuntu/.{{ app_name }}/src'
      repo: 'https://github.com/iOfficeAI/AionUi.git'
      version: 'v2.2.2'
      bun: '/home/ubuntu/.bun/bin/bun'
      api: 'http://127.0.0.1:{{ env.JARVIS_SERVICES[app_name].port }}/api'
  block:
      - name: '{{ app_name | upper }}: Configure Directory'
        file:
            path: '{{ config.root }}'
            state: directory
            mode: '0755'
            owner: ubuntu
            group: ubuntu

      - name: '{{ app_name | upper }}: Build'
        become: true
        become_user: ubuntu
        environment:
            PATH: '/home/ubuntu/.bun/bin:/home/ubuntu/.local/share/fnm/aliases/default/bin:/usr/local/bin:/usr/bin:/bin'
        block:
            - name: '{{ app_name | upper }}: Detect Current Tag'
              command: 'git -C {{ src }} describe --tags --exact-match HEAD'
              register: current_tag
              failed_when: false
              changed_when: false

            - name: '{{ app_name | upper }}: Clone Source'
              git:
                  repo: '{{ repo }}'
                  dest: '{{ src }}'
                  version: '{{ version }}'
                  depth: 1
                  force: true
              when: current_tag.stdout != version
              register: src_change

            - name: '{{ app_name | upper }}: Patch Auth (CF Access fronts this)'
              blockinfile:
                  path: '{{ src }}/packages/desktop/src/renderer/hooks/context/AuthContext.tsx'
                  marker: '    // {mark} AION_AUTH_BYPASS'
                  insertafter: 'const refresh = useCallback\(async \(\) => \{'
                  block: 'setStatus("authenticated"); setUser(null); setReady(true); return;'
              register: auth_patch

            - name: '{{ app_name | upper }}: Install Dependencies'
              command: '{{ bun }} install --ignore-scripts --frozen-lockfile'
              args:
                  chdir: '{{ src }}'
              when: src_change is changed

            - name: '{{ app_name | upper }}: Build Renderer'
              command: '{{ bun }} run package'
              args:
                  chdir: '{{ src }}'
              environment:
                  NODE_OPTIONS: '--max-old-space-size=8192'
              when: src_change is changed or auth_patch is changed

            - name: '{{ app_name | upper }}: Prepare Backend'
              command: '/home/ubuntu/.local/share/fnm/aliases/default/bin/node scripts/prepareAioncore.js'
              args:
                  chdir: '{{ src }}'
              when: src_change is changed
              register: build

      - name: '{{ app_name | upper }}: Configure Systemd Unit'
        copy:
            dest: '/etc/systemd/system/{{ app_name }}.service'
            content: |
                [Unit]
                Description=AionUi WebUI
                After=network.target

                [Service]
                Type=simple
                User=ubuntu
                Group=ubuntu
                WorkingDirectory={{ src }}
                Environment=HOME=/home/ubuntu
                Environment=PATH=/home/ubuntu/.bun/bin:/home/ubuntu/.local/share/fnm/aliases/default/bin:/usr/local/bin:/usr/bin:/bin
                Environment=AIONUI_PORT={{ env.JARVIS_SERVICES[app_name].port }}
                Environment=AIONUI_DATA_DIR={{ config.root }}/{{ app_name }}
                Environment=AIONUI_LOG_LEVEL=info
                Environment=NODE_ENV=production
                ExecStart={{ bun }} scripts/webui.ts --no-build --no-open
                Restart=always
                RestartSec=10
                MemoryMax=4G

                [Install]
                WantedBy=multi-user.target
            mode: '0644'
        register: unit_change

      - name: '{{ app_name | upper }}: Daemon Reload'
        systemd: { daemon_reload: true }
        when: unit_change is changed

      - name: '{{ app_name | upper }}: Enable and Start Service'
        systemd:
            name: '{{ app_name }}'
            state: "{{ 'restarted' if (unit_change is changed or build is changed) else 'started' }}"
            enabled: true

      - name: '{{ app_name | upper }}: Wait for Service Port'
        wait_for:
            port: '{{ env.JARVIS_SERVICES[app_name].port }}'
            host: 127.0.0.1
            timeout: 60

      - name: '{{ app_name | upper }}: Fetch Channel Plugins'
        uri:
            url: '{{ api }}/channel/plugins'
        register: channel_plugins

      - name: '{{ app_name | upper }}: Enable Telegram Plugin'
        uri:
            url: '{{ api }}/channel/plugins/enable'
            method: POST
            body_format: json
            body:
                plugin_id: telegram
                config:
                    credentials: { token: '{{ env.JARVIS_CODE_TELEGRAM_KEY }}' }
                    config: {}
        no_log: true
        register: tg_enable
        failed_when: not tg_enable.json.data.success
        changed_when: true
        when: >-
            channel_plugins.json.data
            | selectattr('plugin_id', 'equalto', 'telegram')
            | selectattr('status', 'equalto', 'running')
            | list | length == 0
