---
- vars:
      app_name: antigravity
      daemon: antigravity-cli-daemon
      instance_name: CodeServer
      units_dir: /home/ubuntu/.config/systemd/user
      config:
          root: '{{ env.JARVIS_CONFIGS_DIR }}/{{ app_name }}'
  become: true
  become_user: ubuntu
  environment:
      XDG_RUNTIME_DIR: /run/user/1001
  block:
      - name: '{{ app_name | upper }}: Install CLI'
        shell: |
            set -eo pipefail
            AGY=/home/ubuntu/.local/bin/agy
            BEFORE=$($AGY --version 2>/dev/null || echo "missing")
            curl -fsSL https://antigravity.google/cli/install.sh | bash -s -- --dir /home/ubuntu/.local/bin >/dev/null 2>&1
            $AGY update >/dev/null 2>&1
            AFTER=$($AGY --version 2>/dev/null || echo "missing")
            if [ "$BEFORE" = "$AFTER" ]; then echo "noop $AFTER"; else echo "diff $BEFORE -> $AFTER"; fi
        args:
            executable: /bin/bash
        register: agy_install_result
        changed_when: "'diff' in agy_install_result.stdout"

      - name: '{{ app_name | upper }}: Enable Linger'
        command: loginctl enable-linger ubuntu
        args:
            creates: /var/lib/systemd/linger/ubuntu
        become_user: root

      - name: '{{ app_name | upper }}: Configure Directories'
        file:
            path: '{{ dir }}'
            state: directory
            mode: '0755'
        loop:
            - '{{ config.root }}'
            - '{{ units_dir }}/{{ daemon }}.service.d'
        loop_control:
            loop_var: dir

      - name: '{{ app_name | upper }}: Write Daemon Override'
        copy:
            dest: '{{ units_dir }}/{{ daemon }}.service.d/override.conf'
            content: |
                [Service]
                Restart=always
                RestartSec=10s
                RestartSteps=10
                RestartMaxDelaySec=1min
                RestartPreventExitStatus=
            mode: '0644'
        register: agy_override

      - name: '{{ app_name | upper }}: Create Watcher Script'
        copy:
            dest: '{{ config.root }}/watch.sh'
            content: |
                #!/bin/bash
                # Token refreshes keep the same refresh_token, so this only fires on a new sign-in or agy version.
                STAMP={{ config.root }}/fingerprint
                NOW="$(jq -r ".token.refresh_token // empty" /home/ubuntu/.gemini/antigravity-cli/antigravity-oauth-token 2>/dev/null | sha256sum) $(/home/ubuntu/.local/bin/agy --version 2>/dev/null)"
                [ "$NOW" = "$(cat "$STAMP" 2>/dev/null)" ] && exit 0
                echo "$NOW" > "$STAMP"
                if systemctl --user is-enabled -q {{ daemon }}; then
                    systemctl --user restart {{ daemon }}
                else
                    /home/ubuntu/.local/bin/agy remote-control start --name {{ instance_name }}
                fi
            mode: '0755'

      - name: '{{ app_name | upper }}: Create Watcher Path'
        copy:
            dest: '{{ units_dir }}/{{ daemon }}-watch.path'
            content: |
                [Unit]
                Description=Restart antigravity remote-control on sign-in or update

                [Path]
                PathChanged=/home/ubuntu/.gemini/antigravity-cli/antigravity-oauth-token
                PathChanged=/home/ubuntu/.local/bin/agy

                [Install]
                WantedBy=default.target
            mode: '0644'
        register: agy_watch_path

      - name: '{{ app_name | upper }}: Create Watcher Service'
        copy:
            dest: '{{ units_dir }}/{{ daemon }}-watch.service'
            content: |
                [Unit]
                Description=Restart antigravity remote-control on sign-in or update
                StartLimitIntervalSec=0

                [Service]
                Type=oneshot
                ExecStart={{ config.root }}/watch.sh
            mode: '0644'
        register: agy_watch_service

      - name: '{{ app_name | upper }}: Daemon Reload'
        systemd:
            daemon_reload: true
            scope: user
        when: agy_override is changed or agy_watch_path is changed or agy_watch_service is changed

      - name: '{{ app_name | upper }}: Enable Watcher'
        systemd:
            name: '{{ daemon }}-watch.path'
            scope: user
            state: started
            enabled: true

      - name: '{{ app_name | upper }}: Register Remote Control Daemon'
        command: /home/ubuntu/.local/bin/agy remote-control start --name {{ instance_name }}
        args:
            creates: '{{ units_dir }}/{{ daemon }}.service'
        register: agy_register
        failed_when: agy_register.rc != 0 and 'not signed in' not in (agy_register.stdout + agy_register.stderr)

      - name: '{{ app_name | upper }}: Enable Daemon'
        systemd:
            name: '{{ daemon }}'
            scope: user
            state: started
            enabled: true
        when: agy_register.rc == 0
