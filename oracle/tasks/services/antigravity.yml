---
- vars:
      app_name: antigravity
  become: true
  become_user: ubuntu
  block:
      - name: '{{ app_name | upper }}: Install CLI'
        shell: |
            set -eo pipefail
            AGY=/home/ubuntu/.local/bin/agy
            BEFORE=$($AGY --version 2>/dev/null || echo "missing")
            curl -fsSL https://antigravity.google/cli/install.sh | bash -s -- --dir /home/ubuntu/.local/bin >/dev/null 2>&1
            $AGY update >/dev/null 2>&1
            AFTER=$($AGY --version 2>/dev/null || echo "missing")
            if [ "$BEFORE" = "$AFTER" ]; then echo "noop $AFTER"; else echo "diff $BEFORE -> $AFTER"; fi
        args:
            executable: /bin/bash
        register: agy_install_result
        changed_when: "'diff' in agy_install_result.stdout"
