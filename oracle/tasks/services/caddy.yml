---
- vars:
      app_name: caddy
      config:
          root: '{{ env.JARVIS_CONFIGS_DIR }}/{{ app_name }}'
      binary: /usr/local/bin/caddy
      download: 'https://caddyserver.com/api/download?os=linux&arch=arm64&p=github.com%2Fmholt%2Fcaddy-l4&p=github.com%2Fcaddy-dns%2Fcloudflare'
  block:
      - name: '{{ app_name | upper }}: Install Binary'
        get_url:
            url: '{{ download }}'
            dest: '{{ binary }}'
            mode: '0755'
            force: true
        register: caddy_binary

      - name: '{{ app_name | upper }}: Configure Directories'
        file:
            path: '{{ item }}'
            state: directory
            mode: '0755'
            owner: ubuntu
            group: ubuntu
        loop:
            - '{{ config.root }}'
            - '{{ config.root }}/data'

      - name: '{{ app_name | upper }}: Write Token EnvironmentFile'
        copy:
            dest: '{{ config.root }}/env'
            content: 'CF_API_TOKEN={{ env.RITIK_CF_DNS_API_TOKEN }}'
            mode: '0600'
            owner: root
            group: root
        no_log: true
        register: caddy_env

      - name: '{{ app_name | upper }}: Create Caddyfile'
        copy:
            dest: '{{ config.root }}/Caddyfile'
            content: |-
                {
                    layer4 {
                {% set pg_dbs = env.JARVIS_DATABASES | selectattr('type', 'equalto', 'postgres') | list %}
                {% set redis_dbs = env.JARVIS_DATABASES | selectattr('type', 'equalto', 'redis') | list %}
                {% if pg_dbs %}
                        :5432 {
                            @postgres postgres {
                                tls enabled
                            }
                            route @postgres {
                                postgres_tls
                                subroute {
                {% for db in pg_dbs %}
                                    @{{ db.name }} tls sni {{ db.host }}
                                    route @{{ db.name }} {
                                        tls {
                                            connection_policy {
                                                alpn postgresql
                                            }
                                        }
                                        proxy 127.0.0.1:{{ db.port }}
                                    }
                {% endfor %}
                                }
                            }
                        }
                {% endif %}
                {% if redis_dbs %}
                        :6379 {
                {% for db in redis_dbs %}
                            @{{ db.name }} tls sni {{ db.host }}
                            route @{{ db.name }} {
                                tls
                                proxy 127.0.0.1:{{ db.port }}
                            }
                {% endfor %}
                            @redis_default tls
                            route @redis_default {
                                tls {
                                    connection_policy {
                                        default_sni {{ redis_dbs[0].host }}
                                    }
                                }
                                proxy 127.0.0.1:{{ redis_dbs[0].port }}
                            }
                        }
                {% endif %}
                    }
                }

                :80 {
                    @codeserver host code.{{ env.RITIK_DOMAIN }}
                    handle @codeserver {
                        handle_path /_fonts/* {
                            root * {{ env.JARVIS_CONFIGS_DIR }}/vscode-web/fonts
                            file_server
                            header Cache-Control "public, max-age=31536000, immutable"
                        }
                        handle_path /_sync/* {
                            reverse_proxy https://vscode-sync.trafficmanager.net {
                                header_up Host vscode-sync.trafficmanager.net
                                header_up -X-Forwarded-Host
                                transport http {
                                    tls
                                    tls_server_name vscode-sync.trafficmanager.net
                                }
                            }
                        }
                        header Cache-Control "no-store, must-revalidate"
                        header CDN-Cache-Control "no-store"
                        header Cloudflare-CDN-Cache-Control "no-store"
                        reverse_proxy localhost:{{ env.JARVIS_SERVICES['vscode-web'].port }}
                    }

                    @aionui host vibe.{{ env.RITIK_DOMAIN }}
                    handle @aionui {
                        reverse_proxy localhost:{{ env.JARVIS_SERVICES.aionui.port }}
                    }

                    @opencode host opencode.{{ env.RITIK_DOMAIN }}
                    handle @opencode {
                        reverse_proxy localhost:{{ env.JARVIS_SERVICES.opencode.port }} {
                            header_up Host localhost
                            header_up -X-Forwarded-Host
                        }
                    }

                    @port_allowed header_regexp portnum Host ^([3-8]\d{3}|9000)\.{{ env.RITIK_DOMAIN | regex_escape }}
                    handle @port_allowed {
                        reverse_proxy localhost:{re.portnum.1}
                    }

                    handle {
                        respond "Forbidden" 403
                    }
                }

                {{ env.JARVIS_DATABASES | map(attribute='host') | join(', ') }} {
                    tls {
                        dns cloudflare {env.CF_API_TOKEN}
                    }
                    respond 404
                }
            mode: '0644'
            owner: ubuntu
            group: ubuntu
        register: caddy_config

      - name: '{{ app_name | upper }}: Validate Config'
        shell: 'set -a && . {{ config.root }}/env && set +a && {{ binary }} validate --config {{ config.root }}/Caddyfile --adapter caddyfile'
        changed_when: false

      - name: '{{ app_name | upper }}: Create Systemd Service'
        copy:
            dest: '/etc/systemd/system/{{ app_name }}.service'
            content: |
                [Unit]
                Description=Caddy
                Documentation=https://caddyserver.com/docs/
                After=network-online.target
                Wants=network-online.target

                [Service]
                Type=notify
                User=ubuntu
                Group=ubuntu
                EnvironmentFile={{ config.root }}/env
                Environment=XDG_CONFIG_HOME={{ config.root }}/config
                Environment=XDG_DATA_HOME={{ config.root }}/data
                ExecStart={{ binary }} run --environ --config {{ config.root }}/Caddyfile --adapter caddyfile
                ExecReload={{ binary }} reload --config {{ config.root }}/Caddyfile --adapter caddyfile --force
                TimeoutStopSec=5s
                LimitNOFILE=1048576
                Restart=on-failure
                RestartSec=5s
                AmbientCapabilities=CAP_NET_BIND_SERVICE
                CapabilityBoundingSet=CAP_NET_BIND_SERVICE
                NoNewPrivileges=true

                [Install]
                WantedBy=multi-user.target
            mode: '0644'
        register: caddy_service

      - name: '{{ app_name | upper }}: Daemon Reload'
        systemd: { daemon_reload: true }
        when: caddy_service is changed

      - name: '{{ app_name | upper }}: Enable and Start Service'
        systemd:
            name: '{{ app_name }}'
            state: "{{ 'restarted' if (caddy_service is changed or caddy_config is changed or caddy_binary is changed or caddy_env is changed) else 'started' }}"
            enabled: true
