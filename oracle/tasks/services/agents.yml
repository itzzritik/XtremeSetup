---
- vars:
      app_name: agents
      config:
          root: '{{ env.JARVIS_CONFIGS_DIR }}/{{ app_name }}'
      global_rules: '{{ config.root }}/AGENTS.md'
      user_context: /usr/local/bin/user-context
      node_path: /home/ubuntu/.local/share/fnm/aliases/default/bin:/usr/local/bin:/usr/bin:/bin
      agent_paths:
          claude: /home/ubuntu/.claude
          claude_json: /home/ubuntu/.claude.json
          codex: /home/ubuntu/.codex
          opencode: /home/ubuntu/.config/opencode
          gemini_config: /home/ubuntu/.gemini/config
          gemini_token: /home/ubuntu/.gemini/antigravity-cli/antigravity-oauth-token
      # order matters: a folder link must exist before links to files inside it
      agent_links:
          - { path: '{{ agent_paths.claude }}', target: .claude, type: dir }
          - { path: '{{ agent_paths.claude_json }}', target: .claude/.claude.json, type: file }
          - { path: '{{ agent_paths.codex }}', target: .codex, type: dir }
          - { path: '{{ agent_paths.gemini_config }}', target: .gemini, type: dir }
          - { path: '{{ agent_paths.gemini_token }}', target: .gemini/antigravity-cli/antigravity-oauth-token, type: file }
      mcp_sync:
          bin: /usr/local/bin/mcp-sync
          source: '{{ config.root }}/mcp'
          path_unit: /etc/systemd/system/mcp-sync.path
          service_unit: /etc/systemd/system/mcp-sync.service
  block:
      - name: '{{ app_name | upper }}: Configure Directories'
        file:
            path: '{{ dir_item }}'
            state: directory
            owner: ubuntu
            group: ubuntu
        loop:
            - '{{ config.root }}'
            - '{{ config.root }}/mcp'
        loop_control:
            loop_var: dir_item

      - name: '{{ app_name | upper }}: Link Agent Configs'
        shell: |
            link() {
                path=$1 target={{ config.root }}/$2 type=$3
                [ -L "$path" ] && [ "$(readlink "$path")" = "$target" ] && return 0
                mkdir -p "$(dirname "$path")" "$(dirname "$target")"
                if [ -L "$path" ]; then
                    rm "$path"
                elif [ -e "$path" ]; then
                    if [ "$type" = dir ]; then
                        rmdir "$target" 2>/dev/null || true
                        [ -e "$target" ] && { echo "both $path and $target exist, merge them by hand" >&2; exit 1; }
                        mv "$path" "$target"
                    else
                        mv -f "$path" "$target"
                    fi
                fi
                [ "$type" = dir ] && mkdir -p "$target"
                ln -s "$target" "$path"
                echo "CHANGED $path"
            }
            {% for item in agent_links %}
            link {{ item.path }} {{ item.target }} {{ item.type }}
            {% endfor %}
        args:
            executable: /bin/bash
        register: link_result
        changed_when: "'CHANGED' in link_result.stdout"
        become: true
        become_user: ubuntu

      - name: '{{ app_name | upper }}: Create Instruction Files'
        copy:
            dest: '{{ file_item.dest }}'
            content: '{{ file_item.content }}'
            owner: ubuntu
            group: ubuntu
            force: false
        loop:
            - { dest: '{{ config.root }}/AGENTS.md', content: '' }
            - { dest: '{{ config.root }}/.claude/CLAUDE.md', content: "@{{ global_rules }}\n" }
            - { dest: '{{ config.root }}/.gemini/GEMINI.md', content: "@{{ global_rules }}\n" }
            - { dest: '{{ config.root }}/.codex/AGENTS.md', content: "@{{ global_rules }}\n" }
        loop_control:
            loop_var: file_item
            label: '{{ file_item.dest | basename }}'

      - name: '{{ app_name | upper }}: Configure Hook Directories'
        file:
            path: '{{ dir_item }}'
            state: directory
            mode: '0755'
        loop:
            - /etc/claude-code
            - /etc/codex
        loop_control:
            loop_var: dir_item

      - name: '{{ app_name | upper }}: Install Session Hooks'
        copy:
            dest: '{{ hook_item.dest }}'
            content: '{{ hook_item.content }}'
            mode: '{{ hook_item.mode | default("0644") }}'
            owner: '{{ hook_item.owner | default("root") }}'
            group: '{{ hook_item.owner | default("root") }}'
        loop:
            - dest: '{{ user_context }}'
              mode: '0755'
              content: "{{ lookup('file', 'agents/user-context') }}\n"
            - dest: /etc/claude-code/managed-settings.json
              content: |
                  {"hooks": {"SessionStart": [{"hooks": [{"type": "command", "command": "{{ user_context }} claude"}]}]}}
            - dest: /etc/codex/hooks.json
              content: |
                  {"hooks": {"SessionStart": [{"hooks": [{"type": "command", "command": "{{ user_context }} codex"}]}]}}
            - dest: '{{ agent_paths.gemini_config }}/hooks.json'
              owner: ubuntu
              content: |
                  {"user-context": {"PreInvocation": [{"type": "command", "command": "{{ user_context }} antigravity", "timeout": 10}]}}
        loop_control:
            loop_var: hook_item
            label: '{{ hook_item.dest }}'

      - name: '{{ app_name | upper }}: Find MCP Server Folders'
        find:
            paths: '{{ config.root }}/mcp'
            file_type: directory
        register: mcp_folders

      - name: '{{ app_name | upper }}: Install MCP Sync'
        copy:
            dest: '{{ sync_item.dest }}'
            content: '{{ sync_item.content }}'
            mode: '{{ sync_item.mode | default("0644") }}'
        loop:
            - dest: '{{ mcp_sync.bin }}'
              mode: '0755'
              content: "{{ lookup('template', 'agents/mcp-sync.py') }}\n"
            - dest: '{{ mcp_sync.service_unit }}'
              content: |
                  [Unit]
                  Description=Sync MCP servers from agents/mcp into every agent

                  [Service]
                  Type=oneshot
                  User=ubuntu
                  Environment=HOME=/home/ubuntu
                  Environment=PATH={{ node_path }}
                  ExecStart={{ mcp_sync.bin }}

                  [Install]
                  WantedBy=multi-user.target
            - dest: '{{ mcp_sync.path_unit }}'
              content: |
                  [Unit]
                  Description=Run mcp-sync when agents/mcp changes

                  [Path]
                  PathModified={{ mcp_sync.source }}
                  {% for folder in mcp_folders.files | map(attribute='path') | map('basename') | sort %}
                  PathModified={{ mcp_sync.source }}/{{ folder }}
                  {% endfor %}

                  [Install]
                  WantedBy=multi-user.target
        loop_control:
            loop_var: sync_item
            label: '{{ sync_item.dest }}'
        register: sync_units

      - name: '{{ app_name | upper }}: Daemon Reload'
        systemd:
            daemon_reload: true
        when: sync_units is changed

      - name: '{{ app_name | upper }}: Enable MCP Sync'
        systemd:
            name: mcp-sync.service
            enabled: true

      - name: '{{ app_name | upper }}: Enable MCP Sync Watcher'
        systemd:
            name: mcp-sync.path
            state: "{{ 'restarted' if sync_units is changed else 'started' }}"
            enabled: true

      - name: '{{ app_name | upper }}: Sync MCP Servers'
        command: '{{ mcp_sync.bin }}'
        environment:
            PATH: '{{ node_path }}'
        register: mcp_sync_result
        changed_when: "'CHANGED' in mcp_sync_result.stdout"
        become: true
        become_user: ubuntu
