---
- name: '{{ app_name | upper }}: Add APT Repositories'
  ansible.builtin.deb822_repository:
      name: '{{ repo.name }}'
      uris: '{{ repo.uri }}'
      suites: '{{ repo.suite }}'
      components: '{{ repo.component | default("main") }}'
      signed_by: '{{ repo.key }}'
      install_python_debian: true
  loop: '{{ apt_repos | default([]) }}'
  loop_control:
      loop_var: repo
      label: '{{ repo.name }}'

- name: '{{ app_name | upper }}: Install APT Packages'
  ansible.builtin.apt:
      name: '{{ apt_packages }}'
      update_cache: '{{ apt_repos is defined }}'
