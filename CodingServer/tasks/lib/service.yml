---
- vars:
      unit: "{{ service.name if '.' in service.name else service.name ~ '.service' }}"
  block:
      - name: '{{ app_name | upper }}: Write {{ unit }}'
        ansible.builtin.copy:
            dest: '/etc/systemd/system/{{ unit }}'
            content: '{{ service.content }}'
        register: unit_file

      - name: '{{ app_name | upper }}: Start {{ unit }}'
        ansible.builtin.systemd_service:
            name: '{{ unit }}'
            daemon_reload: '{{ unit_file is changed }}'
            enabled: true
            state: "{{ omit if not service.start | default(true) else 'restarted' if unit_file is changed or service.restart | default(false) else 'started' }}"
