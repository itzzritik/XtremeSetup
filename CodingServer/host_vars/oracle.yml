---
bootstrap_user: ubuntu
host_name: ritik
domain: '{{ env.RITIK_DOMAIN }}'
machine: Oracle Cloud VM
telegram_key: '{{ env.JARVIS_CODE_TELEGRAM_KEY }}'
databases_public: true
nas:
    host: 192.168.68.245
    port: 2022
    s3_port: 7070
    wireguard: { port: 51820, edge_ip: 10.66.0.1, nas_ip: 10.66.0.2 }
memory:
    user_slice: 18G
    vscode: 10G
    aionui: 4G
    playwright: 4G
machine_tasks:
    - oracle/kernel
    - oracle/firewall
    - oracle/cloudflared
    - oracle/pve
    - oracle/nas
    - oracle/backups
    - oracle/cost
