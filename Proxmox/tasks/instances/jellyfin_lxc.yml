- vars:
      id: '{{ env.JARVIS_SERVICES.jellyfin.id }}'
      instance:
          hostname: jellyfin
          memory: 6144
          swap: 512
          cores: 4
          storage: local-lvm
          ip: '{{ env.JARVIS_NETWORK_PREFIX }}.{{ id }}'
          gateway: '{{ env.JARVIS_GATEWAY }}'
          mac: '{{ env.JARVIS_MAC_PREFIX }}:{{ "%02x" | format(id | int) }}'
      paths:
          config: '{{ env.JARVIS_CONFIGS_DIR }}/{{ instance.hostname }}/etc'
          data: '{{ env.JARVIS_CONFIGS_DIR }}/{{ instance.hostname }}/lib'
      jellyfin_version: '12.1+ubu2404'
  block:
      - name: '{{ instance.hostname | upper }}: Check if Instance exists'
        command: pct status {{ id }}
        register: instance_check
        failed_when: false
        changed_when: false

      - name: '{{ instance.hostname | upper }}: Create Config Directory on Host'
        shell: mkdir -p '{{ dir_item }}' && chmod 0777 '{{ dir_item }}'
        args:
            creates: '{{ dir_item }}'
        loop:
            - '{{ paths.config }}'
            - '{{ paths.data }}'
        loop_control:
            loop_var: dir_item

      - name: '{{ instance.hostname | upper }}: Provision Instance'
        when: instance_check.rc != 0
        block:
            - name: '{{ instance.hostname | upper }}: Stop and Destroy LXC'
              shell: pct stop {{ id }}; pct destroy {{ id }}
              failed_when: false
              changed_when: false

            - name: '{{ instance.hostname | upper }}: Create Temporary Install Directory'
              tempfile:
                  state: directory
                  suffix: _jellyfin_install
              register: temp_install_dir

            - name: '{{ instance.hostname | upper }}: Create default.vars for Silent Install'
              copy:
                  dest: '{{ temp_install_dir.path }}/default.vars'
                  content: |
                      var_container_storage={{ instance.storage }}
                      var_template_storage={{ instance.storage }}

            - name: '{{ instance.hostname | upper }}: Install using community script'
              shell: |
                  export mode="default"
                  export var_ctid="{{ id }}"
                  export var_hostname="{{ instance.hostname }}"
                  export var_cpu="{{ instance.cores }}"
                  export var_ram="{{ instance.memory }}"
                  export var_disk="16"
                  export var_net="{{ instance.ip }}/24"
                  export var_gateway="{{ instance.gateway }}"
                  export var_gpu="yes"
                  export var_unprivileged="1"
                  export TERM=xterm
                  bash -c "$(curl -fsSL {{ env.JARVIS_COMMUNITY_SCRIPTS_URL }}/ct/jellyfin.sh)"
              args:
                  chdir: '{{ temp_install_dir.path }}'
                  executable: /bin/bash
              register: jellyfin_install

            - name: '{{ instance.hostname | upper }}: Configure MAC Address'
              command: pct set {{ id }} -net0 name=eth0,bridge=vmbr0,ip={{ instance.ip }}/24,gw={{ instance.gateway }},hwaddr={{ instance.mac }}

            - name: '{{ instance.hostname | upper }}: Show install output'
              debug:
                  var: jellyfin_install.stdout_lines

            - name: '{{ instance.hostname | upper }}: Cleanup Temporary Directory'
              file:
                  path: '{{ temp_install_dir.path }}'
                  state: absent

            - name: '{{ instance.hostname | upper }}: Stop LXC for Configuration'
              command: pct stop {{ id }}
              ignore_errors: true

            - name: '{{ instance.hostname | upper }}: Set Swap Size'
              command: pct set {{ id }} -swap {{ instance.swap }}

            - name: '{{ instance.hostname | upper }}: Configure LXC Mounts and Passthrough'
              blockinfile:
                  path: '/etc/pve/lxc/{{ id }}.conf'
                  marker: '# {mark} ANSIBLE MANAGED BLOCK'
                  block: |
                      mp1: /mnt/ssd,mp=/media/ssd
                      mp2: {{ paths.config }},mp=/etc/jellyfin
                      mp3: {{ paths.data }},mp=/var/lib/jellyfin
                      lxc.mount.entry: var/cache/transcodes var/lib/jellyfin/transcodes none bind,create=dir,optional 0 0

            - name: '{{ instance.hostname | upper }}: Start LXC'
              command: pct start {{ id }}

      - name: '{{ instance.hostname | upper }}: Install Jellyfin {{ jellyfin_version }}'
        shell: |
            pct exec {{ id }} --keep-env 0 -- bash -se <<'EOF'
            if [ "$(dpkg-query -W -f='${Version}' jellyfin-server 2>/dev/null)" != '{{ jellyfin_version }}' ]; then
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --allow-change-held-packages jellyfin={{ jellyfin_version }} jellyfin-server={{ jellyfin_version }} jellyfin-web={{ jellyfin_version }} >/dev/null
                echo CHANGED
            fi
            apt-mark showhold | grep -qx jellyfin-server || { apt-mark hold -qq jellyfin jellyfin-server jellyfin-web >/dev/null; echo CHANGED; }
            systemctl is-active -q jellyfin || { systemctl enable --now -q jellyfin; echo CHANGED; }
            EOF
        register: jellyfin_package
        changed_when: "'CHANGED' in jellyfin_package.stdout"

      - name: '{{ instance.hostname | upper }}: Wait for Jellyfin'
        uri:
            url: 'http://{{ instance.ip }}:{{ env.JARVIS_SERVICES.jellyfin.port }}/health'
            return_content: true
        register: jellyfin_health
        until: jellyfin_health.content | default('') == 'Healthy'
        retries: 60
        delay: 10

  rescue:
      - debug:
            msg: '{{ instance.hostname }} ({{ id }}) failed to deploy'
  become: true
