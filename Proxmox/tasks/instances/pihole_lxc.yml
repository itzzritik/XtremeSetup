- vars:
      id: '{{ env.JARVIS_SERVICES.pihole.id }}'
      instance:
          hostname: pihole
          memory: 1024
          swap: 512
          cores: 1
          storage: local-lvm
          ip: '{{ env.JARVIS_NETWORK_PREFIX }}.{{ id }}'
          gateway: '{{ env.JARVIS_GATEWAY }}'
          mac: '{{ env.JARVIS_MAC_PREFIX }}:{{ "%02x" | format(id | int) }}'
          subuid: '100000'
      paths:
          config_pihole: '{{ env.JARVIS_CONFIGS_DIR }}/{{ instance.hostname }}/etc-pihole'
          config_dnsmasq: '{{ env.JARVIS_CONFIGS_DIR }}/{{ instance.hostname }}/etc-dnsmasq.d'
      pihole:
          upstreams: ['1.1.1.1', '1.0.0.1', '9.9.9.9']
          adlists:
              - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  block:
      - name: '{{ instance.hostname | upper }}: Check if Instance exists'
        command: pct status {{ id }}
        register: instance_check
        failed_when: false
        changed_when: false

      - name: '{{ instance.hostname | upper }}: Create Config Directories on Host'
        # create-only: pihole-FTL re-owns /etc/pihole to its own user on every start
        shell: mkdir -p '{{ dir_item }}' && chown {{ instance.subuid }}:{{ instance.subuid }} '{{ dir_item }}'
        args:
            creates: '{{ dir_item }}'
        loop:
            - '{{ paths.config_pihole }}'
            - '{{ paths.config_dnsmasq }}'
        loop_control:
            loop_var: dir_item

      - name: '{{ instance.hostname | upper }}: Provision Instance'
        when: instance_check.rc != 0
        block:
            - name: '{{ instance.hostname | upper }}: Stop and Destroy LXC'
              shell: pct stop {{ id }}; pct destroy {{ id }}
              failed_when: false
              changed_when: false

            - name: '{{ instance.hostname | upper }}: Create Temporary Install Directory'
              tempfile:
                  state: directory
                  suffix: _pihole_install
              register: temp_install_dir

            - name: '{{ instance.hostname | upper }}: Create default.vars for Silent Install'
              copy:
                  dest: '{{ temp_install_dir.path }}/default.vars'
                  content: |
                      var_container_storage={{ instance.storage }}
                      var_template_storage={{ instance.storage }}

            - name: '{{ instance.hostname | upper }}: Install using community script'
              shell: |
                  export mode="default"
                  export var_ctid="{{ id }}"
                  export var_hostname="{{ instance.hostname }}"
                  export var_cpu="{{ instance.cores }}"
                  export var_ram="{{ instance.memory }}"
                  export var_disk="4"
                  export var_net="{{ instance.ip }}/24"
                  export var_gateway="{{ instance.gateway }}"
                  export var_unprivileged="1"
                  export TERM=xterm
                  echo -e "y\nn" | bash -c "$(curl -fsSL {{ env.JARVIS_COMMUNITY_SCRIPTS_URL }}/ct/pihole.sh)"
              args:
                  executable: /bin/bash
              register: pihole_install

            - name: '{{ instance.hostname | upper }}: Configure MAC Address'
              command: pct set {{ id }} -net0 name=eth0,bridge=vmbr0,ip={{ instance.ip }}/24,gw={{ instance.gateway }},hwaddr={{ instance.mac }}

            - name: '{{ instance.hostname | upper }}: Show install output'
              debug:
                  var: pihole_install.stdout_lines

            - name: '{{ instance.hostname | upper }}: Cleanup Temporary Directory'
              file:
                  path: '{{ temp_install_dir.path }}'
                  state: absent

            - name: '{{ instance.hostname | upper }}: Stop LXC for Configuration'
              command: pct stop {{ id }}
              ignore_errors: true

            - name: '{{ instance.hostname | upper }}: Set Swap Size'
              command: pct set {{ id }} -swap {{ instance.swap }}

            - name: '{{ instance.hostname | upper }}: Configure LXC Mounts'
              blockinfile:
                  path: '/etc/pve/lxc/{{ id }}.conf'
                  marker: '# {mark} ANSIBLE MANAGED BLOCK'
                  block: |
                      mp0: {{ paths.config_pihole }},mp=/etc/pihole
                      mp1: {{ paths.config_dnsmasq }},mp=/etc/dnsmasq.d

            - name: '{{ instance.hostname | upper }}: Start LXC'
              command: pct start {{ id }}

            - name: '{{ instance.hostname | upper }}: Wait for ready (port 80)'
              wait_for:
                  host: '{{ instance.ip }}'
                  port: 80
                  delay: 5
                  timeout: 60

            - name: '{{ instance.hostname | upper }}: Create Password Set Script'
              copy:
                  dest: '/tmp/pihole_password_set_{{ id }}.sh'
                  content: |
                      #!/bin/bash
                      set -e
                      export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
                      pihole -a -p ''
                  mode: '0666'
              no_log: true

            - name: '{{ instance.hostname | upper }}: Push Password Script to Container'
              command: pct push {{ id }} /tmp/pihole_password_set_{{ id }}.sh /tmp/set_password.sh

            - name: '{{ instance.hostname | upper }}: Execute Password Script'
              command: pct exec {{ id }} -- bash /tmp/set_password.sh
              register: set_password
              until: set_password.rc == 0
              retries: 10
              delay: 5
              no_log: true

            - name: '{{ instance.hostname | upper }}: Remove Password Script from Container'
              command: pct exec {{ id }} -- rm -f /tmp/set_password.sh
              ignore_errors: true

      - name: '{{ instance.hostname | upper }}: Configure DNS and Blocklists'
        shell: |
            pct exec {{ id }} --keep-env 0 -- bash -se <<'EOF'
            # FTL prints arrays unquoted: [ 1.1.1.1, 9.9.9.9 ]
            norm() { tr -d ' "' <<< "$1"; }
            set_config() {
                [ "$(norm "$(pihole-FTL --config "$1")")" = "$(norm "$2")" ] && return
                pihole-FTL --config "$1" "$2" >/dev/null
                echo "CHANGED $1"
            }
            set_config dns.upstreams '{{ pihole.upstreams | to_json }}'
            # unprivileged LXC can't set the clock, so FTL's NTP only logs errors
            set_config ntp.sync.active false
            set_config ntp.ipv4.active false
            set_config ntp.ipv6.active false
            db=/etc/pihole/gravity.db
            refresh=false
            for list in {{ pihole.adlists | map('quote') | join(' ') }}; do
                added=$(pihole-FTL sqlite3 $db "INSERT OR IGNORE INTO adlist (address, enabled) VALUES ('$list', 1); SELECT changes();")
                [ "$added" = 0 ] || { echo "CHANGED adlist $list"; refresh=true; }
            done
            [ "$(pihole-FTL sqlite3 $db 'SELECT count(*) FROM gravity;')" = 0 ] && refresh=true
            if $refresh; then
                pihole -g >/dev/null
                echo CHANGED gravity
                [ "$(pihole-FTL sqlite3 $db 'SELECT count(*) FROM gravity;')" != 0 ] || { echo 'gravity is still empty' >&2; exit 1; }
            fi
            EOF
        register: config_result
        changed_when: "'CHANGED' in config_result.stdout"

      - name: '{{ instance.hostname | upper }}: Verify DNS Resolves'
        command: dig +short +time=3 @{{ instance.ip }} cloudflare.com
        register: dns_check
        until: dns_check.stdout | length > 0
        retries: 5
        delay: 3
        changed_when: false

  rescue:
      - debug:
            msg: '{{ instance.hostname }} ({{ id }}) failed to deploy'
  become: true
