---
- vars:
      app_name: antigravity
      daemon: antigravity-cli-daemon
      instance_name: '{{ env.JARVIS_BOT_NAME }}'
      agy: '{{ lxc_paths.local_bin }}/agy'
      units_dir: /root/.config/systemd/user
      watcher: /usr/local/lib/{{ app_name }}/watch.sh
      config:
          local: '{{ env.JARVIS_CONFIGS_DIR }}/{{ app_name }}'
  block:
      - name: '{{ app_name | upper }}: Install CLI'
        shell: |
            {{ lxc_exec }} <<'EOF'
            BEFORE=$({{ agy }} --version 2>/dev/null || echo "missing")
            curl -fsSL https://antigravity.google/cli/install.sh | bash -s -- --dir {{ lxc_paths.local_bin }} >/dev/null 2>&1
            {{ agy }} update >/dev/null 2>&1
            AFTER=$({{ agy }} --version 2>/dev/null || echo "missing")
            [ "$BEFORE" = "$AFTER" ] || echo "CHANGED $BEFORE -> $AFTER"
            EOF
        register: agy_install_result
        changed_when: "'CHANGED' in agy_install_result.stdout"

      - name: '{{ app_name | upper }}: Enable Linger'
        shell: |
            {{ lxc_exec }} <<'EOF'
            if [ ! -f /var/lib/systemd/linger/root ]; then
                loginctl enable-linger root
                echo CHANGED
            fi
            for i in $(seq 30); do [ -S {{ lxc_paths.runtime_dir }}/systemd/private ] && exit 0; sleep 1; done
            exit 1
            EOF
        register: linger_result
        changed_when: "'CHANGED' in linger_result.stdout"

      - name: '{{ app_name | upper }}: Write Units and Watcher'
        include_tasks: lxc_file.yml
        loop:
            - dest: '{{ units_dir }}/{{ daemon }}.service.d/override.conf'
              content: |
                  [Service]
                  Restart=always
                  RestartSec=10s
                  RestartSteps=10
                  RestartMaxDelaySec=1min
                  RestartPreventExitStatus=
            - dest: '{{ watcher }}'
              mode: '0755'
              content: |
                  #!/bin/bash
                  # Token refreshes keep the same refresh_token, so this only fires on a new sign-in or agy version.
                  STAMP={{ config.local }}/fingerprint
                  mkdir -p "$(dirname "$STAMP")"
                  NOW="$(jq -r ".token.refresh_token // empty" {{ lxc_paths.gemini_token }} 2>/dev/null | sha256sum) $({{ agy }} --version 2>/dev/null)"
                  [ "$NOW" = "$(cat "$STAMP" 2>/dev/null)" ] && exit 0
                  echo "$NOW" > "$STAMP"
                  if systemctl --user is-enabled -q {{ daemon }}; then
                      systemctl --user restart {{ daemon }}
                  else
                      {{ agy }} remote-control start --name {{ instance_name }}
                  fi
            - dest: '{{ units_dir }}/{{ daemon }}-watch.path'
              content: |
                  [Unit]
                  Description=Restart antigravity remote-control on sign-in or update

                  [Path]
                  PathChanged={{ lxc_paths.gemini_token }}
                  PathChanged={{ agy }}

                  [Install]
                  WantedBy=default.target
            - dest: '{{ units_dir }}/{{ daemon }}-watch.service'
              content: |
                  [Unit]
                  Description=Restart antigravity remote-control on sign-in or update
                  StartLimitIntervalSec=0

                  [Service]
                  Type=oneshot
                  ExecStart={{ watcher }}
        loop_control:
            loop_var: lxc_file
            label: '{{ lxc_file.dest }}'

      - name: '{{ app_name | upper }}: Enable Watcher'
        include_tasks: lxc_service.yml
        vars:
            lxc_service:
                name: '{{ daemon }}-watch.path'
                user: true
                restart: >-
                    {{ (units_dir ~ '/' ~ daemon ~ '-watch.path') in lxc_changed | default([])
                    or (units_dir ~ '/' ~ daemon ~ '-watch.service') in lxc_changed | default([])
                    or (units_dir ~ '/' ~ daemon ~ '.service.d/override.conf') in lxc_changed | default([]) }}

      - name: '{{ app_name | upper }}: Register Remote Control Daemon'
        shell: |
            {{ lxc_exec }} <<'EOF'
            export XDG_RUNTIME_DIR={{ lxc_paths.runtime_dir }}
            if [ ! -f {{ units_dir }}/{{ daemon }}.service ]; then
                out=$({{ agy }} remote-control start --name {{ instance_name | quote }} 2>&1) || {
                    echo "$out" | grep -q 'not signed in' && exit 0
                    echo "$out"
                    exit 1
                }
                echo CHANGED
            fi
            systemctl --user is-enabled -q {{ daemon }} && systemctl --user is-active -q {{ daemon }} && exit 0
            systemctl --user enable -q --now {{ daemon }}
            echo CHANGED
            EOF
        register: agy_register
        changed_when: "'CHANGED' in agy_register.stdout"
