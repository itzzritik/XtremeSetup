---
- vars:
      app_name: aionui
      config:
          local: '{{ env.JARVIS_CONFIGS_DIR }}/{{ app_name }}'
      src: '/root/.{{ app_name }}/src'
      stamp: '/root/.{{ app_name }}/built-{{ version }}'
      auth_file: '{{ src }}/packages/desktop/src/renderer/hooks/context/AuthContext.tsx'
      unit: '/etc/systemd/system/{{ app_name }}.service'
      repo: 'https://github.com/iOfficeAI/AionUi.git'
      version: 'v2.2.2'
      bun: '{{ lxc_paths.bun_bin }}/bun'
      api: 'http://127.0.0.1:{{ env.JARVIS_SERVICES[app_name].app_port }}/api'
      telegram_key: '{{ env.JARVIS_BOT_TELEGRAM_KEY }}'
  block:
      - name: '{{ app_name | upper }}: Clone Source'
        shell: |
            {{ lxc_exec }} <<'EOF'
            [ "$(git -C {{ src }} describe --tags --exact-match HEAD 2>/dev/null)" = {{ version }} ] && exit 0
            rm -rf {{ src }} {{ stamp }}
            git clone -q --depth 1 --branch {{ version }} {{ repo }} {{ src }}
            echo CHANGED
            EOF
        register: src_change
        changed_when: "'CHANGED' in src_change.stdout"

      - name: '{{ app_name | upper }}: Patch Auth (VoidAuth fronts this)'
        include_tasks: lxc_file.yml
        vars:
            lxc_file:
                dest: '{{ auth_file }}'
                marker: '    // {mark} AION_AUTH_BYPASS'
                insertafter: 'const refresh = useCallback\(async \(\) => \{'
                block: 'setStatus("authenticated"); setUser(null); setReady(true); return;'

      - name: '{{ app_name | upper }}: Build'
        shell: |
            {{ lxc_exec }} <<'EOF'
            {% if auth_file not in lxc_changed | default([]) %}
            [ -f {{ stamp }} ] && exit 0
            {% endif %}
            export PATH={{ lxc_env_path }}
            trap 'tail -40 /root/.{{ app_name }}/build.log' ERR
            cd {{ src }}
            {
                {{ bun }} install --ignore-scripts --frozen-lockfile
                NODE_OPTIONS=--max-old-space-size=8192 {{ bun }} run package
                {{ lxc_paths.node_bin }}/node scripts/prepareAioncore.js
            } > /root/.{{ app_name }}/build.log 2>&1
            echo {{ version }} > {{ stamp }}
            echo CHANGED
            EOF
        register: build
        changed_when: "'CHANGED' in build.stdout"

      - name: '{{ app_name | upper }}: Write Systemd Unit'
        include_tasks: lxc_file.yml
        vars:
            lxc_file:
                dest: '{{ unit }}'
                content: |
                    [Unit]
                    Description=AionUi WebUI
                    After=network.target

                    [Service]
                    Type=simple
                    WorkingDirectory={{ src }}
                    Environment=HOME=/root
                    Environment=PATH={{ lxc_env_path }}
                    Environment=AIONUI_PORT={{ env.JARVIS_SERVICES[app_name].app_port }}
                    Environment=AIONUI_DATA_DIR={{ config.local }}/{{ app_name }}
                    Environment=AIONUI_LOG_LEVEL=info
                    Environment=NODE_ENV=production
                    ExecStart={{ bun }} scripts/webui.ts --no-build --no-open
                    Restart=always
                    RestartSec=10
                    MemoryMax=4G
                    OOMPolicy=continue

                    [Install]
                    WantedBy=multi-user.target

      - name: '{{ app_name | upper }}: Enable and Start Service'
        include_tasks: lxc_service.yml
        vars:
            lxc_service:
                name: '{{ app_name }}'
                restart: '{{ unit in lxc_changed | default([]) or build is changed }}'

      - name: '{{ app_name | upper }}: Enable Telegram Plugin'
        shell: |
            {{ lxc_exec }} <<'EOF'
            for i in $(seq 60); do curl -sf -o /dev/null {{ api }}/channel/plugins && break; sleep 1; done
            status=$(curl -sf {{ api }}/channel/plugins | jq -r '.data[] | select(.plugin_id == "telegram") | .status')
            [ "$status" = running ] && [ "$(cat {{ config.local }}/telegram-bot 2>/dev/null)" = {{ telegram_key.split(':')[0] }} ] && exit 0
            curl -sf -X POST -H 'Content-Type: application/json' \
                -d {{ {'plugin_id': 'telegram', 'config': {'credentials': {'token': telegram_key}, 'config': {}}} | to_json | quote }} \
                {{ api }}/channel/plugins/enable | jq -e '.data.success' >/dev/null
            printf %s {{ telegram_key.split(':')[0] }} > {{ config.local }}/telegram-bot
            echo CHANGED
            EOF
        register: tg_enable
        changed_when: "'CHANGED' in tg_enable.stdout"
        no_log: true
