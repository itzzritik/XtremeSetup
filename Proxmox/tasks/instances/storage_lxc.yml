- vars:
      id: '{{ env.JARVIS_SERVICES.storage.id }}'
      instance:
          hostname: storage
          memory: 1024
          swap: 256
          cores: 2
          storage: local-lvm
          ip: '{{ env.JARVIS_NETWORK_PREFIX }}.{{ id }}'
          gateway: '{{ env.JARVIS_GATEWAY }}'
          mac: '{{ env.JARVIS_MAC_PREFIX }}:{{ "%02x" | format(id | int) }}'
      shares:
          - name: ssd
            path: '/media/ssd'
            auth_required: true
            comment: 'SSD Full Access'
          - name: media
            path: '/media/ssd/Media'
            auth_required: false
            comment: 'Media Library (Guest Access)'
      sftp:
          root: '/media/ssd'
          port: 2022
          user: nas
      rclone_version: '1.75.2'
  block:
      - name: '{{ instance.hostname | upper }}: Check if Instance exists'
        command: pct status {{ id }}
        register: instance_check
        failed_when: false
        changed_when: false

      - name: '{{ instance.hostname | upper }}: Check SMB Service'
        command: smbclient -L //{{ instance.ip }} -U {{ env.JARVIS_ADMIN_USERNAME }}%{{ env.JARVIS_ADMIN_PASSWORD }}
        register: smb_check
        failed_when: false
        changed_when: false
        when: instance_check.rc == 0

      - name: '{{ instance.hostname | upper }}: Check NFS Service'
        command: showmount -e {{ instance.ip }}
        register: nfs_check
        failed_when: false
        changed_when: false
        when: instance_check.rc == 0

      - name: '{{ instance.hostname | upper }}: Check Privileged Status'
        shell: "pct config {{ id }} | grep -q 'unprivileged: 1'"
        register: is_unprivileged
        failed_when: false
        changed_when: false
        when: instance_check.rc == 0

      - name: '{{ instance.hostname | upper }}: Force Rebuild if Unprivileged (NFS Req)'
        shell: pct stop {{ id }} && pct destroy {{ id }}
        when: instance_check.rc == 0 and is_unprivileged.rc == 0
        changed_when: true

      - name: '{{ instance.hostname | upper }}: Reset Instance Check'
        set_fact:
            instance_check: { 'rc': 1 }
        when: instance_check.rc == 0 and is_unprivileged.rc == 0

      - name: '{{ instance.hostname | upper }}: Provision Infrastructure'
        when: instance_check.rc != 0
        block:
            - name: '{{ instance.hostname | upper }}: Cleanup Existing LXC'
              shell: pct stop {{ id }} 2>/dev/null; pct destroy {{ id }} 2>/dev/null; true
              changed_when: false

            - name: '{{ instance.hostname | upper }}: Download Latest Template'
              shell: |
                  pveam update >&2
                  TEMPLATE=$(pveam available | grep -oP 'ubuntu-(2[02468]|[3-9][02468])\.04-standard[^\s]+' | sort -V | tail -1)
                  pveam download local "$TEMPLATE" >&2 || true
                  echo "$TEMPLATE"
              register: template_result
              changed_when: false

            - name: '{{ instance.hostname | upper }}: Create LXC'
              command: >
                  pct create {{ id }} local:vztmpl/{{ template_result.stdout | trim }}
                  --hostname {{ instance.hostname }}
                  --cores {{ instance.cores }}
                  --memory {{ instance.memory }}
                  --swap {{ instance.swap }}
                  --rootfs {{ instance.storage }}:8
                  --net0 name=eth0,bridge=vmbr0,ip={{ instance.ip }}/24,gw={{ instance.gateway }},hwaddr={{ instance.mac }}
                  --unprivileged 0
                  --features nesting=1
                  --onboot 1

            - name: '{{ instance.hostname | upper }}: Configure Mounts'
              blockinfile:
                  path: '/etc/pve/lxc/{{ id }}.conf'
                  marker: '# {mark} ANSIBLE MANAGED BLOCK'
                  block: |
                      mp1: /mnt/ssd,mp=/media/ssd

            - name: '{{ instance.hostname | upper }}: Start LXC'
              command: pct start {{ id }}

            - name: '{{ instance.hostname | upper }}: Wait for Network'
              shell: pct exec {{ id }} -- ping -c 1 -W 2 {{ env.JARVIS_DNS_SERVERS[0] }}
              register: network_check
              until: network_check.rc == 0
              retries: 10
              delay: 3

            - name: '{{ instance.hostname | upper }}: Enable Console Autologin'
              shell: >
                  pct exec {{ id }} -- bash -c "mkdir -p /etc/systemd/system/container-getty@1.service.d &&
                  echo -e '[Service]\nExecStart=\nExecStart=-/sbin/agetty --autologin root --noclear --keep-baud tty%I 115200,38400,9600 \$TERM' > /etc/systemd/system/container-getty@1.service.d/override.conf &&
                  systemctl daemon-reload && systemctl restart container-getty@1.service"

      - name: '{{ instance.hostname | upper }}: SMB Setup'
        when: instance_check.rc != 0 or (smb_check is defined and smb_check.rc != 0)
        block:
            - name: '{{ instance.hostname | upper }}: Install Samba'
              shell: |
                  pct exec {{ id }} -- bash -c '
                  export DEBIAN_FRONTEND=noninteractive
                  apt-get update && apt-get install -y samba
                  '
              retries: 2
              delay: 5

            - name: '{{ instance.hostname | upper }}: Configure Samba'
              shell: |
                  pct exec {{ id }} -- bash -c "
                  cat <<'EOF' > /etc/samba/smb.conf
                  [global]
                  workgroup = WORKGROUP
                  server string = Storage Server
                  security = user
                  map to guest = Bad User
                  log file = /var/log/samba/%m.log
                  max log size = 50
                  vfs objects = catia fruit streams_xattr
                  fruit:metadata = stream
                  fruit:model = MacSamba
                  fruit:veto_appledouble = yes
                  fruit:delete_empty_adfiles = yes
                  fruit:wipe_intentionally_left_blank_rfork = yes
                  veto files = /._*/.DS_Store/
                  delete veto files = yes

                  {% for share in shares %}
                  [{{ share.name }}]
                  path = {{ share.path }}
                  comment = {{ share.comment }}
                  browseable = yes
                  writable = yes
                  {% if share.auth_required %}
                  guest ok = no
                  valid users = {{ env.JARVIS_ADMIN_USERNAME }}
                  create mask = 0664
                  directory mask = 0775
                  {% else %}
                  guest ok = yes
                  read only = no
                  create mask = 0666
                  directory mask = 0777
                  force user = nobody
                  force group = nogroup
                  {% endif %}

                  {% endfor %}
                  EOF

                  (echo '{{ env.JARVIS_ADMIN_PASSWORD }}'; echo '{{ env.JARVIS_ADMIN_PASSWORD }}') | smbpasswd -a -s {{ env.JARVIS_ADMIN_USERNAME }}
                  smbpasswd -e {{ env.JARVIS_ADMIN_USERNAME }}

                  {% for share in shares %}
                  chmod -R {{ '777' if not share.auth_required else '775' }} {{ share.path }} 2>/dev/null || true
                  {% endfor %}

                  systemctl enable --now smbd nmbd 2>/dev/null || true
                  systemctl restart smbd nmbd
                  "

      - name: '{{ instance.hostname | upper }}: NFS Setup'
        when: instance_check.rc != 0 or (nfs_check is defined and nfs_check.rc != 0)
        block:
            - name: '{{ instance.hostname | upper }}: Configure AppArmor (NFS Support)'
              blockinfile:
                  path: '/etc/pve/lxc/{{ id }}.conf'
                  marker: '# {mark} ANSIBLE NFS'
                  block: |
                      lxc.apparmor.profile: unconfined

            - name: '{{ instance.hostname | upper }}: Restart LXC (Apply Features)'
              shell: pct stop {{ id }} && pct start {{ id }}
              changed_when: false

            - name: '{{ instance.hostname | upper }}: Wait for Network'
              shell: pct exec {{ id }} -- ping -c 1 -W 2 {{ env.JARVIS_DNS_SERVERS[0] }}
              register: network_check_nfs
              until: network_check_nfs.rc == 0
              retries: 10
              delay: 3

            - name: '{{ instance.hostname | upper }}: Install NFS'
              shell: |
                  pct exec {{ id }} -- bash -c '
                  export DEBIAN_FRONTEND=noninteractive
                  apt-get update && apt-get install -y nfs-kernel-server
                  '
              retries: 2
              delay: 5

            - name: '{{ instance.hostname | upper }}: Configure NFS'
              shell: |
                  pct exec {{ id }} -- bash -c "
                  systemctl mask rpc-gssd rpc-svcgssd
                  systemctl disable --now rpc-gssd rpc-svcgssd || true

                  cat <<'EOF' > /etc/exports
                  {% for share in shares %}
                  {% if share.auth_required %}
                  {{ share.path }} {{ env.JARVIS_NETWORK_PREFIX }}.0/24(rw,sync,no_subtree_check,sec=sys)
                  {% else %}
                  {{ share.path }} {{ env.JARVIS_NETWORK_PREFIX }}.0/24(rw,sync,no_subtree_check,all_squash,anonuid=65534,anongid=65534)
                  {% endif %}
                  {% endfor %}
                  EOF

                  {% for share in shares %}
                  chmod -R {{ '777' if not share.auth_required else '775' }} {{ share.path }} 2>/dev/null || true
                  {% endfor %}

                  exportfs -ra

                  systemctl enable --now rpcbind nfs-kernel-server 2>/dev/null || true
                  systemctl restart rpcbind nfs-kernel-server
                  "

      - name: '{{ instance.hostname | upper }}: SFTP Setup'
        block:
            - name: '{{ instance.hostname | upper }}: Install Rclone {{ rclone_version }}'
              shell: |
                  pct exec {{ id }} --keep-env 0 -- bash -se <<'EOF'
                  [ "$(rclone version 2>/dev/null | awk 'NR==1{print $2}')" = 'v{{ rclone_version }}' ] && exit 0
                  wget -qO /tmp/rclone.deb https://downloads.rclone.org/v{{ rclone_version }}/rclone-v{{ rclone_version }}-linux-amd64.deb
                  DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/rclone.deb >/dev/null && rm -f /tmp/rclone.deb
                  echo CHANGED
                  EOF
              register: rclone_binary
              changed_when: "'CHANGED' in rclone_binary.stdout"

            - name: '{{ instance.hostname | upper }}: Generate SFTP Host Key'
              shell: |
                  pct exec {{ id }} --keep-env 0 -- bash -se <<'EOF'
                  [ -f /etc/rclone/sftp_host_ed25519 ] && exit 0
                  mkdir -p /etc/rclone && ssh-keygen -q -t ed25519 -N '' -C {{ instance.hostname }} -f /etc/rclone/sftp_host_ed25519
                  echo CHANGED
                  EOF
              register: sftp_key
              changed_when: "'CHANGED' in sftp_key.stdout"

            - name: '{{ instance.hostname | upper }}: Configure SFTP Service'
              shell: |
                  pct exec {{ id }} --keep-env 0 -- bash -se <<'EOF'
                  put() { [ "$(cat $1 2>/dev/null)" = "$3" ] && return; (umask 077; printf '%s\n' "$3" > $1.new) && chmod $2 $1.new && mv $1.new $1 && echo CHANGED; }
                  put /etc/rclone/sftp.env 600 'RCLONE_USER={{ sftp.user }}
                  RCLONE_PASS={{ env.JARVIS_NAS_PASSWORD }}'
                  put /etc/systemd/system/rclone-sftp.service 644 '[Unit]
                  Description=rclone SFTP
                  After=network-online.target
                  Wants=network-online.target
                  RequiresMountsFor={{ sftp.root }}

                  [Service]
                  EnvironmentFile=/etc/rclone/sftp.env
                  ExecStart=/usr/bin/rclone serve sftp {{ sftp.root }} --addr :{{ sftp.port }} --key /etc/rclone/sftp_host_ed25519 --authorized-keys= --dir-cache-time 1s
                  UMask=0002
                  ProtectSystem=strict
                  ReadWritePaths={{ sftp.root }}
                  ProtectHome=yes
                  PrivateTmp=yes
                  NoNewPrivileges=yes
                  CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_FSETID
                  Restart=always
                  RestartSec=5

                  [Install]
                  WantedBy=multi-user.target'
                  put /etc/cron.d/rclone-partial 644 "0 4 * * * root find {{ sftp.root }} -xdev -type f -regextype posix-extended -regex '.*\.[0-9a-f]{8}\.partial' -mmin +1440 -delete"
                  EOF
              register: sftp_service
              changed_when: "'CHANGED' in sftp_service.stdout"
              no_log: true

            - name: '{{ instance.hostname | upper }}: Start SFTP Service'
              shell: |
                  pct exec {{ id }} --keep-env 0 -- bash -se <<'EOF'
                  if {{ 'true' if rclone_binary is changed or sftp_key is changed or sftp_service is changed else 'false' }}; then
                      systemctl daemon-reload && systemctl enable rclone-sftp && systemctl restart rclone-sftp
                      echo CHANGED
                  elif ! systemctl is-active -q rclone-sftp; then
                      systemctl enable --now rclone-sftp
                      echo CHANGED
                  fi
                  EOF
              register: sftp_start
              changed_when: "'CHANGED' in sftp_start.stdout"

      - name: '{{ instance.hostname | upper }}: Verify Services'
        shell: |
            pct exec {{ id }} -- bash -c '
            echo "SMB: $(systemctl is-active smbd)"
            echo "NFS: $(systemctl is-active nfs-kernel-server)"
            echo "SFTP: $(systemctl is-active rclone-sftp)"
            '
        changed_when: false
        register: service_status
        failed_when: false

      - name: '{{ instance.hostname | upper }}: Show Service Status'
        debug:
            msg: '{{ service_status.stdout_lines }}'

  rescue:
      - debug:
            msg: '{{ instance.hostname }} ({{ id }}) failed to deploy'
  become: true
