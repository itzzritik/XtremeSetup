- vars:
      id: '{{ env.JARVIS_SERVICES.traefik.id }}'
      instance:
          hostname: traefik
          memory: 2048
          swap: 512
          cores: 2
          storage: local-lvm
          ip: '{{ env.JARVIS_NETWORK_PREFIX }}.{{ id }}'
          gateway: '{{ env.JARVIS_GATEWAY }}'
          mac: '{{ env.JARVIS_MAC_PREFIX }}:{{ "%02x" | format(id | int) }}'
          subuid: '100000'
      paths:
          config: '{{ env.JARVIS_CONFIGS_DIR }}/{{ instance.hostname }}'
          cloudflared_config: '{{ env.JARVIS_CONFIGS_DIR }}/{{ instance.hostname }}/cloudflared'
      traefik_version: '3.7.13'
      cloudflared_version: '2026.9.3'
  block:
      - name: '{{ instance.hostname | upper }}: Check if Instance exists'
        command: pct status {{ id }}
        register: instance_check
        failed_when: false
        changed_when: false

      - name: '{{ instance.hostname | upper }}: Create Config Directories on Host'
        shell: mkdir -p '{{ dir_item }}' && chown {{ instance.subuid }}:{{ instance.subuid }} '{{ dir_item }}'
        args:
            creates: '{{ dir_item }}'
        loop:
            - '{{ paths.config }}'
            - '{{ paths.config }}/dynamic'
            - '{{ paths.cloudflared_config }}'
        loop_control:
            loop_var: dir_item

      - name: '{{ instance.hostname | upper }}: Provision Instance'
        when: instance_check.rc != 0
        block:
            - name: '{{ instance.hostname | upper }}: Stop and Destroy LXC'
              shell: pct stop {{ id }}; pct destroy {{ id }}
              failed_when: false
              changed_when: false

            - name: '{{ instance.hostname | upper }}: Create Temporary Install Directory'
              tempfile:
                  state: directory
                  suffix: _traefik_install
              register: temp_install_dir

            - name: '{{ instance.hostname | upper }}: Create default.vars for Silent Install'
              copy:
                  dest: '{{ temp_install_dir.path }}/default.vars'
                  content: |
                      var_container_storage={{ instance.storage }}
                      var_template_storage={{ instance.storage }}
                      var_sysctl_conf="net.ipv4.ip_forward=1"

            - name: '{{ instance.hostname | upper }}: Install using community script'
              shell: |
                  export mode="default"
                  export var_ctid="{{ id }}"
                  export var_hostname="{{ instance.hostname }}"
                  export var_cpu="{{ instance.cores }}"
                  export var_ram="{{ instance.memory }}"
                  export var_disk="8"
                  export var_net="{{ instance.ip }}/24"
                  export var_gateway="{{ instance.gateway }}"
                  export var_unprivileged="1"
                  export TERM=xterm
                  bash -c "$(curl -fsSL {{ env.JARVIS_COMMUNITY_SCRIPTS_URL }}/ct/traefik.sh)"
              args:
                  chdir: '{{ temp_install_dir.path }}'
                  executable: /bin/bash
              register: traefik_install

            - name: '{{ instance.hostname | upper }}: Configure MAC Address'
              command: pct set {{ id }} -net0 name=eth0,bridge=vmbr0,ip={{ instance.ip }}/24,gw={{ instance.gateway }},hwaddr={{ instance.mac }}

            - name: '{{ instance.hostname | upper }}: Show install output'
              debug:
                  var: traefik_install.stdout_lines

            - name: '{{ instance.hostname | upper }}: Cleanup Temporary Directory'
              file:
                  path: '{{ temp_install_dir.path }}'
                  state: absent

            - name: '{{ instance.hostname | upper }}: Stop LXC for Configuration'
              command: pct stop {{ id }}
              ignore_errors: true

            - name: '{{ instance.hostname | upper }}: Set Swap Size'
              command: pct set {{ id }} -swap {{ instance.swap }}

            - name: '{{ instance.hostname | upper }}: Configure LXC Mounts'
              blockinfile:
                  path: '/etc/pve/lxc/{{ id }}.conf'
                  marker: '# {mark} ANSIBLE MANAGED BLOCK'
                  block: |
                      mp0: {{ paths.config }},mp=/etc/traefik
                      mp1: {{ paths.cloudflared_config }},mp=/etc/cloudflared

            - name: '{{ instance.hostname | upper }}: Start LXC'
              command: pct start {{ id }}

      - name: '{{ instance.hostname | upper }}: Configure service'
        block:
            - name: '{{ instance.hostname | upper }}: Ensure acme.json exists'
              file:
                  path: '{{ paths.config }}/acme.json'
                  state: touch
                  access_time: preserve
                  modification_time: preserve
                  mode: '0600'
                  owner: '{{ instance.subuid }}'
                  group: '{{ instance.subuid }}'

            - name: '{{ instance.hostname | upper }}: Update static config'
              register: traefik_static
              copy:
                  dest: '{{ paths.config }}/traefik.yml'
                  content: |
                      global:
                        checkNewVersion: true
                        sendAnonymousUsage: false

                      log:
                        level: INFO

                      api:
                        dashboard: true
                        insecure: true

                      entryPoints:
                        web:
                          address: ":80"
                          http:
                            redirections:
                              entryPoint:
                                to: websecure
                                scheme: https
                        websecure:
                          address: ":443"
                          http:
                            tls:
                              certResolver: letsencrypt

                      providers:
                        file:
                          directory: /etc/traefik/dynamic
                          watch: true

                      certificatesResolvers:
                        letsencrypt:
                          acme:
                            email: "{{ env.RITIK_EMAIL }}"
                            storage: /etc/traefik/acme.json
                            dnsChallenge:
                              provider: cloudflare
                              resolvers:
                                - "1.1.1.1:53"
                                - "8.8.8.8:53"
                  owner: '{{ instance.subuid }}'
                  group: '{{ instance.subuid }}'
                  mode: '0666'

            - name: '{{ instance.hostname | upper }}: Update dynamic rules'
              copy:
                  dest: '{{ paths.config }}/dynamic/rules.yml'
                  content: |
                      http:
                        serversTransports:
                          insecureTransport:
                            insecureSkipVerify: true

                        middlewares:
                          auth:
                            forwardAuth:
                              address: "http://{{ env.JARVIS_NETWORK_PREFIX }}.{{ env.JARVIS_SERVICES.voidauth.id }}:{{ env.JARVIS_SERVICES.voidauth.port }}/api/authz/forward-auth"
                              trustForwardHeader: true
                              authResponseHeaders:
                                - Remote-User
                                - Remote-Name
                                - Remote-Email
                                - Remote-Groups

                          pihole-redirect:
                            redirectRegex:
                              regex: "^https?://{{ env.JARVIS_SERVICES.pihole.subdomains[0] }}\\.{{ env.JARVIS_DOMAIN | replace('.', '\\.') }}/?$"
                              replacement: "https://{{ env.JARVIS_SERVICES.pihole.subdomains[0] }}.{{ env.JARVIS_DOMAIN }}/admin/"

                        routers:
                      {% for svc_key, svc in env.JARVIS_SERVICES.items() %}
                      {% if svc.subdomains is defined or svc.root_domain | default(false) or svc.host_regexp is defined %}
                          {{ svc_key }}:
                            rule: "{% if svc.host_regexp is defined %}HostRegexp(`^{{ svc.host_regexp }}[.]{{ env.JARVIS_DOMAIN | replace('.', '[.]') }}$`){% elif svc.root_domain | default(false) %}Host(`{{ env.JARVIS_DOMAIN }}`){% else %}{% for subdomain in svc.subdomains %}Host(`{{ subdomain }}.{{ env.JARVIS_DOMAIN }}`){% if not loop.last %} || {% endif %}{% endfor %}{% endif %}"
                            service: "{{ 'api@internal' if svc.is_internal | default(false) else svc_key }}"
                      {% if svc.host_regexp is defined %}
                            tls:
                              certResolver: "{{ env.JARVIS_CERT_RESOLVER }}"
                              domains:
                                - main: "{{ env.JARVIS_DOMAIN }}"
                                  sans:
                                    - "*.{{ env.JARVIS_DOMAIN }}"
                      {% endif %}
                      {% set all_middlewares = [] %}
                      {% if not svc.skip_auth | default(false) %}
                      {% set _ = all_middlewares.append('auth') %}
                      {% endif %}
                      {% for mw in svc.middlewares | default([]) %}
                      {% set _ = all_middlewares.append(mw) %}
                      {% endfor %}
                      {% if all_middlewares | length > 0 %}
                            middlewares:
                      {% for mw in all_middlewares %}
                              - "{{ mw }}"
                      {% endfor %}
                      {% endif %}
                      {% endif %}
                      {% endfor %}

                        services:
                      {% for svc_key, svc in env.JARVIS_SERVICES.items() %}
                      {% if (svc.subdomains is defined or svc.root_domain | default(false) or svc.host_regexp is defined) and not svc.is_internal | default(false) %}
                          {{ svc_key }}:
                            loadBalancer:
                              servers:
                                - url: "{{ 'https' if svc.https | default(false) else 'http' }}://{{ env.JARVIS_NETWORK_PREFIX }}.{{ svc.id }}:{{ svc.port }}"
                      {% if svc.insecure | default(false) %}
                              serversTransport: "insecureTransport"
                      {% endif %}
                      {% endif %}
                      {% endfor %}
                  owner: '{{ instance.subuid }}'
                  group: '{{ instance.subuid }}'
                  mode: '0666'

            - name: '{{ instance.hostname | upper }}: Install Traefik {{ traefik_version }}'
              shell: |
                  pct exec {{ id }} --keep-env 0 -- bash -se <<'EOF'
                  [ "$(traefik version | awk '/^Version:/{print $2}')" = '{{ traefik_version }}' ] && exit 0
                  curl -fsSL https://github.com/traefik/traefik/releases/download/v{{ traefik_version }}/traefik_v{{ traefik_version }}_linux_amd64.tar.gz | tar -xz -C /usr/bin traefik
                  echo CHANGED
                  EOF
              register: traefik_binary
              changed_when: "'CHANGED' in traefik_binary.stdout"

            - name: '{{ instance.hostname | upper }}: Configure Service Override'
              shell: |
                  pct exec {{ id }} --keep-env 0 -- bash -se <<'EOF'
                  f=/etc/systemd/system/traefik.service.d/override.conf
                  want='[Service]
                  ExecStart=
                  ExecStart=/usr/bin/traefik --configFile=/etc/traefik/traefik.yml
                  Environment="CF_DNS_API_TOKEN={{ env.JARVIS_CF_DNS_API_TOKEN }}"'
                  [ "$(cat $f 2>/dev/null)" = "$want" ] && exit 0
                  mkdir -p "${f%/*}" && printf '%s\n' "$want" > $f && systemctl daemon-reload
                  echo CHANGED
                  EOF
              register: traefik_override
              changed_when: "'CHANGED' in traefik_override.stdout"
              no_log: true

            - name: '{{ instance.hostname | upper }}: Restart service'
              command: pct exec {{ id }} --keep-env 0 -- systemctl restart traefik
              when: traefik_static is changed or traefik_override is changed or traefik_binary is changed

      - name: '{{ instance.hostname | upper }}: Configure tunnel'
        block:
            - name: '{{ instance.hostname | upper }}: Install Cloudflared {{ cloudflared_version }}'
              shell: |
                  pct exec {{ id }} --keep-env 0 -- bash -se <<'EOF'
                  [ "$(cloudflared --version 2>/dev/null | awk '{print $3}')" = '{{ cloudflared_version }}' ] && exit 0
                  curl -fsSL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/download/{{ cloudflared_version }}/cloudflared-linux-amd64.deb
                  dpkg -i /tmp/cloudflared.deb >/dev/null && rm -f /tmp/cloudflared.deb
                  echo CHANGED
                  EOF
              register: cloudflared_binary
              changed_when: "'CHANGED' in cloudflared_binary.stdout"

            - name: '{{ instance.hostname | upper }}: Configure Cloudflared Service'
              shell: |
                  pct exec {{ id }} --keep-env 0 -- bash -se <<'EOF'
                  if ! systemctl cat cloudflared 2>/dev/null | grep -qF -- '{{ env.JARVIS_CF_TUNNEL_TOKEN }}'; then
                      cloudflared service uninstall >/dev/null 2>&1 || true
                      cloudflared service install '{{ env.JARVIS_CF_TUNNEL_TOKEN }}' >/dev/null 2>&1
                      echo CHANGED
                  elif {{ 'true' if cloudflared_binary is changed else 'false' }}; then
                      systemctl restart cloudflared
                      echo CHANGED
                  fi
                  EOF
              register: cloudflared_service
              changed_when: "'CHANGED' in cloudflared_service.stdout"
              no_log: true
              when: env.JARVIS_CF_TUNNEL_TOKEN is defined and env.JARVIS_CF_TUNNEL_TOKEN | length > 0

  rescue:
      - debug:
            msg: '{{ instance.hostname }} ({{ id }}) failed to deploy'
  become: true
