---
- name: 'UPDATE: Check Last Update Time'
  stat:
      path: '{{ env.JARVIS_DIR }}/last_apt_update'
  register: last_update

- name: 'UPDATE: Get Current Timestamp'
  shell: date +%s
  register: current_time
  changed_when: false

- name: 'UPDATE: System Update & Cleanup'
  block:
      - name: 'UPDATE: Update Apt Cache'
        block:
            - name: 'UPDATE: Run Apt Update'
              command: apt-get update
        rescue:
            - name: 'UPDATE: Clear apt lists and cache'
              shell: rm -rf /var/lib/apt/lists/* /var/cache/apt/*.bin && apt-get clean

            - name: 'UPDATE: Retry Apt Update'
              command: apt-get update

      - name: 'UPDATE: Safe Package Upgrade'
        block:
            - name: 'UPDATE: Upgrade, Autoremove & Clean'
              apt:
                  upgrade: dist
                  autoremove: yes
                  purge: yes
                  autoclean: yes
        rescue:
            - name: 'UPDATE: Repair Broken Packages & Corrupt Cache'
              shell: |
                  apt-get clean
                  apt-get update
                  dpkg --configure -a --force-confdef --force-confold
                  apt-get --fix-broken install -y
                  apt-get clean

            - name: 'UPDATE: Retry Upgrade, Autoremove & Clean'
              apt:
                  upgrade: dist
                  autoremove: yes
                  purge: yes
                  autoclean: yes

      - name: 'UPDATE: Update Timestamp'
        file:
            path: '{{ env.JARVIS_DIR }}/last_apt_update'
            state: touch
  become: true
  when: not last_update.stat.exists or ((current_time.stdout | int - last_update.stat.mtime | int) > 86400)

- name: 'UPDATE: List Running Containers'
  shell: pct list | awk 'NR > 1 && $2 == "running" {print $1}'
  register: running_lxc
  changed_when: false

- name: 'UPDATE: Upgrade Containers'
  shell: |
      pct exec {{ lxc_id }} --keep-env 0 -- bash -se <<'EOF'
      export DEBIAN_FRONTEND=noninteractive
      [ -n "$(find /var/lib/apt/lists -maxdepth 0 -mmin -1440)" ] || apt-get update -qq
      apt-get -s dist-upgrade | grep -q '^Inst' || exit 0
      apt-get -y -qq -o Dpkg::Options::=--force-confold dist-upgrade >/dev/null
      apt-get -y -qq autoremove --purge >/dev/null
      apt-get -y -qq autoclean >/dev/null
      echo CHANGED
      EOF
  loop: '{{ running_lxc.stdout_lines }}'
  loop_control:
      loop_var: lxc_id
  register: lxc_upgrade
  changed_when: "'CHANGED' in lxc_upgrade.stdout"
